<!doctype html>
<html lang="pt-BR" class="guard">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="guard.js"></script>
<title>Minha área | Farias Barbearia</title>
<link rel="preload" href="fonts/bebas-neue.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#090e26">
<link rel="stylesheet" href="app.css">
<style>
header{position:sticky;top:0;z-index:40;background:rgba(0,0,0,.96);border-bottom:1px solid var(--line)}
.hd{max-width:1100px;margin:0 auto;padding:0 16px;height:62px;display:flex;align-items:center;justify-content:space-between}
.me{display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:50%;background:var(--teal);color:#ffffff;font-weight:700;font-size:13px;display:grid;place-items:center}
.me button{font-size:13px;color:var(--muted);background:none;border:0;cursor:pointer;padding:12px 10px;margin:-12px 0}
.layout{max-width:1100px;margin:0 auto;padding:24px 16px 110px;display:grid;grid-template-columns:210px 1fr;gap:28px}
.side{position:sticky;top:86px;align-self:start;display:grid;gap:4px}
.tab{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:var(--muted);font-weight:500;font-size:14.5px;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.tab svg{width:19px;height:19px}
.tab:hover{color:var(--txt);background:var(--card)}
.tab.on{color:var(--teal-2);background:var(--teal-bg)}
.view{display:none}.view.on{display:block}
h1{font-family:"Bebas Neue";font-weight:400;font-size:40px;line-height:1}
.sub{color:var(--muted);font-size:14.5px;margin:4px 0 22px}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
.alert{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-radius:16px;padding:16px 18px;margin-bottom:16px;background:var(--bad-bg);border:1px solid rgba(228,109,109,.35)}
.alert b{display:block;color:var(--bad)}
.alert span{font-size:13.5px;color:var(--txt);opacity:.85}
.alert.info{background:var(--teal-bg);border-color:var(--teal-d)}
.alert.info b{color:var(--teal-2)}.alert.info span{color:var(--muted)}
.alert.warn{background:var(--warn-bg);border-color:rgba(227,165,79,.35)}
.alert.warn b{color:var(--warn)}
.plan{padding:22px;background:linear-gradient(140deg,#1b2550,var(--card) 70%);border-color:var(--teal-d)}
.plan.susp{background:var(--card);border-color:rgba(228,109,109,.35)}
.plan.none{background:var(--card);border-color:var(--line)}
.plan .top{display:flex;justify-content:space-between;align-items:center}
.plan h2{font-family:"Bebas Neue";font-weight:400;font-size:32px;margin:12px 0 2px}
.plan .meta{font-size:13px;color:var(--muted);margin-bottom:18px}
.meters{display:grid;gap:14px}
.box{padding:20px}
.box h3{font-size:15px;font-weight:600;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.box h3 a{font-size:13px;color:var(--teal-2);font-weight:500}
.appt{display:flex;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--bg-2)}
.appt+.appt{margin-top:10px}
.dbox{flex:0 0 56px;text-align:center;border-right:1px solid var(--line);padding-right:12px}
.dbox small{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.dbox b{display:block;font-family:"Bebas Neue";font-weight:400;font-size:28px;line-height:1.05}
.appt .inf{flex:1;min-width:0}
.appt strong{display:block;font-size:14.5px}
.appt .inf span{font-size:12.5px;color:var(--muted)}
.appt .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.quick a{display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--card);font-size:14px;font-weight:600}
.quick a svg{width:20px;height:20px;color:var(--teal)}
.quick a:hover{border-color:var(--teal-d)}
.perks{list-style:none;display:grid;gap:9px}
.perks li{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:#d4d4d8;padding-bottom:9px;border-bottom:1px dashed var(--line)}
.perks li:last-child{border:0;padding:0}
.perks li b{color:var(--teal-2);font-weight:600;text-align:right}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);padding:0 10px 10px}
td{padding:13px 10px;border-top:1px solid var(--line)}
td.r,th.r{text-align:right}
.kv{display:grid;gap:12px}
.kv div{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14.5px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.kv div:last-child{border:0;padding:0}
.kv span{color:var(--muted)}
.plans{display:grid;gap:10px;margin-top:16px}
.popt{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border:1px solid var(--line-2);border-radius:13px;cursor:pointer;background:var(--bg-2)}
.popt.on{border-color:var(--teal);background:var(--teal-bg)}
.popt strong{display:block;font-size:14.5px}
.popt small{color:var(--muted);font-size:12.5px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opt{border:1px solid var(--line-2);border-radius:12px;padding:12px;text-align:center;cursor:pointer;background:var(--bg-2);font-size:14px}
.opt.on{border-color:var(--teal);background:var(--teal-bg);color:var(--teal-2)}
.days{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px}
.day{flex:0 0 64px;border:1px solid var(--line-2);background:var(--bg-2);border-radius:12px;padding:8px 0;text-align:center;cursor:pointer;color:var(--txt);font-family:inherit}
.day small{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.day b{display:block;font-family:"Bebas Neue";font-weight:400;font-size:24px;line-height:1.1}
.day.on{border-color:var(--teal);background:var(--teal-bg)}
.day:disabled{opacity:.35;cursor:not-allowed}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;margin-top:10px;max-height:200px;overflow:auto}
.slot{border:1px solid var(--line-2);background:none;color:var(--teal-2);border-radius:10px;padding:8px 0;font-size:14px;cursor:pointer;font-family:inherit}
.slot.on{background:var(--teal);color:#ffffff;border-color:var(--teal)}
.offer{background:var(--teal-bg);border:1px solid var(--teal-d);border-radius:12px;padding:14px;margin-top:16px;font-size:13.5px}
.offer b{color:var(--teal-2)}
.pix-head{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:13px;font-weight:600;color:var(--teal-2)}
.pix-head .pay-ic{width:30px;height:30px}
.pix{font-family:ui-monospace,monospace;font-size:12px;background:var(--bg-2);border:1px dashed var(--line-2);border-radius:10px;padding:12px;word-break:break-all;color:var(--muted);margin:14px 0}
.empty{color:var(--muted);font-size:14px}
.demo{position:fixed;right:16px;bottom:16px;z-index:60;background:var(--card-2);border:1px solid var(--line-2);border-radius:14px;padding:10px;box-shadow:0 12px 30px rgba(0,0,0,.5);max-width:300px}
.demo small{display:block;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:0 0 6px 2px}
.demo select{width:100%;background:var(--bg-2);border:1px solid var(--line-2);color:var(--txt);border-radius:9px;padding:8px;font-family:inherit;font-size:13px}
.bnav{display:none}
@media(max-width:860px){
  .layout{grid-template-columns:1fr;padding-top:18px}
  .side{display:none}
  .grid2{grid-template-columns:1fr}
  .bnav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(5,5,11,.97);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bnav .tab{flex-direction:column;gap:3px;font-size:12px;padding:7px 2px;justify-content:center;text-align:center;align-items:center}
  .demo{bottom:78px;right:10px;left:10px;max-width:none}
  .appt{flex-wrap:wrap}
  .appt .acts{width:100%;justify-content:flex-start;padding-left:70px}
}
</style>
</head>
<body>
<a class="skip" href="#main">Pular para o conteúdo</a>
<header><div class="hd">
  <a href="index.html" class="logo" translate="no"><img class="logo-img" src="logo-h.webp" alt="Farias Barbearia" width="560" height="285"></a>
  <div class="me"><button id="logout">Sair</button><div class="av" id="av"></div></div>
</div></header>

<div class="layout">
  <nav class="side" id="side"></nav>
  <main id="main">
    <section class="view" id="v-inicio"></section>
    <section class="view" id="v-agenda"></section>
    <section class="view" id="v-pagamentos"></section>
    <section class="view" id="v-plano"></section>
  </main>
</div>
<nav class="bnav" id="bnav"></nav>
<div class="demo" id="demobox" hidden><small>Ver como (demonstração)</small><select id="demosel"></select></div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="store.js"></script>
<script src="pay.js"></script>
<script src="assinante.js"></script>
</body>
</html>
