<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel | Farias Barbearia</title>
<link rel="preload" href="fonts/bebas-neue.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#090e26">
<link rel="stylesheet" href="app.css">
<style>
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh;background:linear-gradient(90deg,var(--bg-2) 235px,var(--line) 235px 236px,transparent 236px)}
.side{padding:18px 12px;display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh;overflow-y:auto}
.nav{display:grid;gap:2px}
.ngrp{font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);padding:12px 12px 4px}
.tab{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--muted);font-weight:500;font-size:14px;cursor:pointer;border:0;background:none;text-align:left;width:100%;white-space:nowrap;transition:background .15s,color .15s}
.tab svg{width:17px;height:17px;flex:0 0 17px}
.tab:hover{color:var(--txt);background:var(--card)}
.tab.on{color:var(--teal-2);background:var(--teal-bg)}
.tab .cnt{margin-left:auto;font-size:12px;font-weight:700;background:var(--bad-bg);color:var(--bad);border-radius:999px;padding:1px 7px}
.side .me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:11px;border:1px solid var(--line);border-radius:14px}
.av{width:34px;height:34px;border-radius:50%;background:var(--teal);color:#ffffff;font-weight:700;font-size:13px;display:grid;place-items:center;flex:0 0 34px}
.side .me small{display:block;color:var(--dim);font-size:12px}.side .me b{font-size:14px}
main{padding:26px 30px 70px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h1{font-family:"Bebas Neue";font-weight:400;font-size:40px;line-height:1}
.top p{color:var(--muted);font-size:14px;margin-top:4px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.view{display:none}.view.on{display:block}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.kpi{padding:15px}
.kpi small{display:block;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.kpi b{display:block;font-family:"Bebas Neue";font-weight:400;font-size:32px;line-height:1.1;margin-top:6px}
.kpi span{font-size:12.5px;color:var(--muted)}
.up{color:var(--teal-2)!important}.dn{color:var(--bad)!important}
.g21{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.g11{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.box{padding:20px}
.box+.box{margin-top:16px}
.box h3{font-size:15px;font-weight:600;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.box h3 small{font-size:12.5px;color:var(--muted);font-weight:400}
.hint{font-size:12.5px;color:var(--dim)}
/* hoje */
.ti{display:grid;grid-template-columns:58px 1fr auto;gap:14px;align-items:center;padding:11px 4px;border-top:1px solid var(--line)}
.ti:first-child{border:0}
.ti .h{font-family:"Bebas Neue";font-size:22px;line-height:1;color:var(--muted)}
.ti strong{font-size:14.5px;display:block}
.ti .inf span{font-size:12.5px;color:var(--muted)}
.ti .r{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.ti.done .h,.ti.done strong{color:var(--dim)}
.ti.now{background:var(--teal-bg);border-radius:12px;border-color:transparent}
.al{display:flex;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg-2);align-items:flex-start}
.al+.al{margin-top:10px}
.al .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:0 0 32px}
.al .ic svg{width:16px;height:16px}
.al b{font-size:14px;display:block}.al span{font-size:12.5px;color:var(--muted)}
.al .btn{margin-top:8px}
/* agenda */
.cal-wrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:52px repeat(6,minmax(128px,1fr));min-width:840px}
.cal .hd{padding:10px 8px;text-align:center;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.cal .hd b{display:block;font-family:"Bebas Neue";font-size:24px;font-weight:400;color:var(--txt);line-height:1}
.cal .hd.today b{color:var(--teal)}
.cal .hd.hol{color:var(--warn)}
.hcol div{height:56px;font-size:12px;color:var(--dim);text-align:right;padding-right:8px;transform:translateY(-7px)}
.dcol{position:relative;border-left:1px solid var(--line);background:repeating-linear-gradient(180deg,transparent 0 55px,var(--line) 55px 56px)}
.ev{position:absolute;left:4px;right:4px;border-radius:8px;padding:4px 7px;font-size:12px;line-height:1.3;overflow:hidden;border:0;border-left:3px solid;text-align:left;cursor:pointer;font-family:inherit;transition:filter .15s,transform .15s}
.ev:hover{filter:brightness(1.25);z-index:2}
.ev b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev{z-index:1}.ev.block{z-index:0}
.ev.plan{background:rgba(207,213,227,.14);border-color:var(--teal);color:#e4e4e7}
.ev.avl{background:rgba(122,167,230,.13);border-color:var(--info);color:var(--txt)}
.ev.block{background:repeating-linear-gradient(45deg,#0a0b20 0 6px,#08091a 6px 12px);border-color:var(--dim);color:var(--muted)}
.ev.miss{background:var(--bad-bg);border-color:var(--bad);color:var(--txt)}
.ev.done{opacity:.55}
.closed{position:absolute;left:0;right:0;display:grid;place-items:center;color:var(--dim);font-size:12px;background:rgba(0,0,0,.25)}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
/* tabelas */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:0 12px 10px;white-space:nowrap}
td{padding:11px 12px;border-top:1px solid var(--line);white-space:nowrap;vertical-align:middle}
td small{display:block;color:var(--dim);font-size:12px}
tr.click{cursor:pointer}tr.click:hover td{background:rgba(255,255,255,.02)}
.rowbtn{font:inherit;font-weight:700;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.ferr{color:var(--bad);font-size:13px;margin-top:6px}.inp[aria-invalid="true"]{border-color:var(--bad)}
.r{text-align:right}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.fbtn{border:1px solid var(--line-2);background:none;color:var(--muted);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer}
.fbtn.on{border-color:var(--teal);color:var(--teal-2);background:var(--teal-bg)}
.search{margin-left:auto;max-width:240px;padding:8px 12px;font-size:14px}
.mini-bar{width:80px;height:6px;border-radius:6px;background:#191b40;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:8px}
.mini-bar i{display:block;height:100%;background:var(--teal)}
.pcards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.pc{padding:15px}.pc small{font-size:12.5px;color:var(--muted)}
.pc b{display:block;font-family:"Bebas Neue";font-weight:400;font-size:30px;line-height:1.1}.pc span{font-size:12px;color:var(--dim)}
/* financeiro */
.chart{display:flex;align-items:flex-end;gap:18px;height:220px;padding:10px 4px 0;border-bottom:1px solid var(--line)}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.stack{width:100%;max-width:54px;display:flex;flex-direction:column-reverse;border-radius:6px 6px 0 0;overflow:hidden}
.stack i{display:block}.stack .s1{background:var(--teal)}.stack .s2{background:var(--info)}
.col .v{font-size:12px;color:var(--muted)}
.xl{display:flex;gap:18px;padding:8px 4px 0}.xl span{flex:1;text-align:center;font-size:12px;color:var(--dim)}
/* formulários */
.form{display:grid;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.fl label{display:block;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.inp{padding:10px 12px;font-size:14px}
textarea.inp{resize:vertical;min-height:70px;line-height:1.45}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.sw{position:relative;width:40px;height:22px;flex:0 0 40px;display:inline-block}
.sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}.sw input:focus-visible+span{outline:2px solid #e3e8f2;outline-offset:2px}
.sw span{position:absolute;inset:0;border-radius:22px;background:#1d2048;cursor:pointer;transition:.2s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#aab1ca;transition:.2s}
.sw input:checked+span{background:var(--teal-d)}
.sw input:checked+span::after{left:21px;background:var(--teal-2)}
.sw input:disabled+span{opacity:.5;cursor:not-allowed}
.set{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.set:first-of-type{border:0}
.set small{display:block;color:var(--dim);font-size:12.5px}
.set select{width:auto;min-width:120px}
.days-pick{display:flex;gap:6px;flex-wrap:wrap}
.days-pick button{font:inherit;background:none;border:1px solid var(--line-2);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;color:var(--muted);user-select:none}
.days-pick button.on{border-color:var(--teal);color:var(--teal-2);background:var(--teal-bg)}
.hrow{display:grid;grid-template-columns:120px 1fr 1fr 50px;gap:10px;align-items:center;font-size:14px;padding:6px 0}
.list-ed{display:grid;gap:10px}
.li-ed{display:grid;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg-2);position:relative}
.li-ed .rm{position:absolute;top:8px;right:8px}
.gal-ed{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.gimg{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg-2)}
.gimg .ph{aspect-ratio:4/3;background:linear-gradient(155deg,#0c0d24,#000000) center/cover;display:grid;place-items:center;color:var(--dim);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.gimg .fields{padding:10px;display:grid;gap:6px}
.gimg .fields .inp{padding:7px 9px;font-size:13px}
.gimg .tools{position:absolute;top:8px;right:8px;display:flex;gap:6px}
.gimg .tools label,.gimg .tools button{width:30px;height:30px;border-radius:9px;background:rgba(0,0,0,.6);border:1px solid var(--line-2);color:#fff;display:grid;place-items:center;cursor:pointer}
.gimg .tools svg{width:15px;height:15px}
.chips-var{display:flex;gap:6px;flex-wrap:wrap}
.chips-var button{border:1px dashed var(--line-2);background:none;color:var(--teal-2);border-radius:8px;padding:3px 8px;font-size:12px;cursor:pointer;font-family:ui-monospace,monospace}
.msg{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;padding:16px 0;border-top:1px solid var(--line)}
.msg:first-of-type{border:0;padding-top:0}
.msg .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.msg .hd b{font-size:14.5px}
.bubble{background:#0b2a1e;border:1px solid #154a35;border-radius:12px 12px 12px 3px;padding:12px 14px;font-size:13.5px;color:#dff3ea;align-self:start;white-space:pre-wrap;position:relative}
.bubble small{display:block;text-align:right;color:#7fb79d;font-size:12px;margin-top:6px}
.bubble.off{opacity:.4}
.perm td{text-align:center}.perm td:first-child{text-align:left;white-space:normal}
.perm input{accent-color:#cfd5e3;width:16px;height:16px}
.loge{display:grid;grid-template-columns:92px 1fr auto;gap:14px;align-items:center;padding:12px 4px;border-top:1px solid var(--line)}
.loge:first-child{border:0}
.loge time{font-size:12.5px;color:var(--dim)}
.loge b{font-size:14px;font-weight:500;display:block}
.loge span{font-size:12.5px;color:var(--muted)}
.loge.undone b{text-decoration:line-through;color:var(--dim)}
.empty{color:var(--muted);font-size:14px;padding:10px 0}
.mbox.wide{max-width:640px}
.mbox .form{margin-top:16px}
.mact{flex-wrap:wrap}
.sec{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.sec h4{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.fix{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-bottom:8px}
.fix .inp{padding:8px 10px}
.hist-mini{display:grid;gap:6px;max-height:180px;overflow:auto}
.hist-mini div{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:6px 0;border-bottom:1px dashed var(--line)}
.opts4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.opts4 .opt{text-transform:capitalize;border:1px solid var(--line-2);border-radius:12px;padding:12px 6px;text-align:center;cursor:pointer;background:var(--bg-2);font-size:13px}
.opts4 .opt.on{border-color:var(--teal);background:var(--teal-bg);color:var(--teal-2)}
@media(max-width:560px){.opts4{grid-template-columns:1fr 1fr}}
.li-ed{padding-right:52px}
.g21>.box+.box,.g11>.box+.box{margin-top:0}.g21+.box,.g11+.box,.g21+.card,.g11+.card{margin-top:16px}
.mtop{display:none}
@media(max-width:1180px){.kpis{grid-template-columns:repeat(3,1fr)}.pcards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:960px){
  .app{grid-template-columns:1fr;background:none}
  .side{display:none}
  .mtop{display:block;position:sticky;top:0;z-index:40;background:rgba(5,5,11,.97);border-bottom:1px solid var(--line)}
  .mtop .row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
  .mtop .nav{display:flex;overflow-x:auto;gap:4px;padding:0 34px 10px 10px;-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 34px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 34px),transparent)}
  .mtop .ngrp{display:none}
  .mtop .tab{width:auto;padding:11px 12px;min-height:40px;font-size:13px}
  main{padding:20px 16px 60px}
  .g21,.g11,.msg{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}.kpi:last-child:nth-child(odd){grid-column:1/-1}
  .search{margin-left:0;max-width:none;width:100%}
  .hrow{grid-template-columns:1fr 1fr 50px}.hrow>span:first-child{grid-column:1/-1;font-weight:600}
}
@media(max-width:560px){.ti{grid-template-columns:48px 1fr}.ti .r{grid-column:2;justify-content:flex-start}.two,.three{grid-template-columns:1fr}.loge{grid-template-columns:1fr}.chart,.xl{gap:8px}}
</style>
</head>
<body>
<a class="skip" href="#main">Pular para o conteúdo</a>
<div class="mtop"><div class="row"><a href="index.html" class="logo" translate="no"><img class="logo-img" src="logo-h.webp" alt="Farias Barbearia" width="560" height="285"></a><a href="entrar.html#equipe" class="av" title="Sair" aria-label="Sair">FA</a></div><nav class="nav" id="mnav"></nav></div>
<div class="app">
  <aside class="side">
    <a href="index.html" class="logo" translate="no"><img class="logo-img" src="logo-h.webp" alt="Farias Barbearia" width="560" height="285"></a>
    <nav class="nav" id="snav"></nav>
    <div class="me"><div class="av">FA</div><div><b>Farias</b><small>Administrador</small></div><a href="entrar.html#equipe" title="Sair" aria-label="Sair" style="margin:-6px -6px -6px auto;padding:6px;display:inline-flex;color:var(--muted)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></a></div>
  </aside>
  <main id="main">
    <section class="view" id="v-hoje"></section>
    <section class="view" id="v-agenda"></section>
    <section class="view" id="v-clientes"></section>
    <section class="view" id="v-assinantes"></section>
    <section class="view" id="v-financeiro"></section>
    <section class="view" id="v-servicos"></section>
    <section class="view" id="v-conteudo"></section>
    <section class="view" id="v-mensagens"></section>
    <section class="view" id="v-equipe"></section>
    <section class="view" id="v-historico"></section>
    <section class="view" id="v-config"></section>
  </main>
</div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="store.js"></script>
<script src="pay.js"></script>
<script src="painel.js"></script>
</body>
</html>
